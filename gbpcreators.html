<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorilla Tag Gear Painters</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }

        /* Glow effect for outlined text */
        .glow-outline {
            color: #000;
            -webkit-text-stroke: 2px #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #fff, 0 0 20px #fff;
        }

        header {
            text-align: center;
            padding: 50px 20px 20px;
        }

            header h1 {
                font-size: 3rem;
                font-weight: 700;
                margin-bottom: 10px;
            }

        .owners {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .owner-card {
            background: #111;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            width: 180px;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

            .owner-card:hover {
                transform: translateY(-10px);
                box-shadow: 0 10px 25px rgba(255,255,255,0.3);
            }

            .owner-card img {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                border: 3px solid #fff;
                object-fit: cover;
                margin-bottom: 15px;
            }

        .owner-name {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .owner-handle {
            font-size: 0.9rem;
            color: #aaa;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }

        .gear-painters-section {
            text-align: center;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            background: #111;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255,255,255,0.2);
        }

            .gear-painters-section h2 {
                font-size: 2.5rem;
                margin-bottom: 20px;
            }

        .gear-painters-list {
            font-size: 1.2rem;
            color: #aaa;
            min-height: 50px;
        }

        footer {
            text-align: center;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
            background: #000;
        }

            /* Neon glow effect for footer logos */
            footer a img {
                width: 40px;
                height: 40px;
                transition: transform 0.3s, filter 0.3s;
                filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px #fff) drop-shadow(0 0 15px #fff) drop-shadow(0 0 20px #fff);
            }

                footer a img:hover {
                    transform: scale(1.2);
                    filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 20px #fff) drop-shadow(0 0 30px #fff) drop-shadow(0 0 40px #fff);
                }

        @media (max-width: 600px) {
            .owners {
                gap: 30px;
            }

            .owner-card {
                width: 140px;
                padding: 15px;
            }

                .owner-card img {
                    width: 100px;
                    height: 100px;
                }

            header h1 {
                font-size: 2.2rem;
            }

            .gear-painters-section h2 {
                font-size: 2rem;
            }

            footer a img {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="glow-outline">Gorilla Tag Gear Painter Program</h1>
        <div class="owners">
            <a href="https://www.youtube.com/@ItzSneakyzzGT" class="owner-card" target="_blank">
                <img src="assets/sneakyzz.png" alt="Sneakyzz PFP">
                <div class="owner-name glow-outline">Sneakyzz</div>
                <div class="owner-handle">@sneakyzzGT</div>
            </a>
            <a href="https://www.youtube.com/@imcrab" class="owner-card" target="_blank">
                <img src="assets/imcrab.png" alt="imcrab PFP">
                <div class="owner-name glow-outline">imcrab</div>
                <div class="owner-handle">@imcrab</div>
            </a>
        </div>
    </header>

    <main>
        <section class="gear-painters-section">
            <h2 class="glow-outline">Gear Painters</h2>
            <div class="gear-painters-list">No gear painters yet.</div>
        </section>
    </main>

    <footer>
        <a href="https://discord.gg/tRUP2bH4jf" target="_blank">
            <img src="assets/dis.png" alt="Discord Logo">
        </a>
        <a href="https://www.tiktok.com/@official_gearpainter" target="_blank">
            <img src="assets/tik.png" alt="TikTok Logo">
        </a>
    </footer>

</body>
</html>
