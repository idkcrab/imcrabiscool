<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Images</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        img {
            width: 90%;
            max-width: 800px;
            margin: 20px 0;
            border-radius: 12px;
            display: block;
        }
    </style>
</head>
<body>
    <img src="a.png" alt="a">
    <img src="b.png" alt="b">
    <img src="c.png" alt="c">
</body>
</html>
