<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Display</title>
    <style>
        /* Make the image centered on the page */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000; /* Optional: black background */
        }
        img {
            max-width: 200%;
            max-height: 200%;
        }
    </style>
</head>
<body>
    <img src="6.png" alt="Image">
</body>
</html>
