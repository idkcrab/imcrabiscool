<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorilla Tag Badge Application</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top left, #0b0b0b, #0a0a0a 70%);
            color: #f5f5f5;
            overflow-y: scroll;
        }

            body::before, body::after {
                content: "";
                position: fixed;
                width: 500px;
                height: 500px;
                background: radial-gradient(circle, rgba(100,100,100,0.3), transparent 70%);
                border-radius: 50%;
                filter: blur(140px);
                animation: float 12s ease-in-out infinite alternate;
                z-index: -1;
            }

            body::after {
                right: -200px;
                bottom: -200px;
                background: radial-gradient(circle, rgba(70,70,70,0.3), transparent 70%);
                animation-delay: 6s;
            }

        @keyframes float {
            from {
                transform: translateY(0px);
            }

            to {
                transform: translateY(40px);
            }
        }

        .form-container {
            background: rgba(25, 25, 25, 0.95);
            backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: 20px;
            max-width: 700px;
            margin: 60px auto;
            box-shadow: 0 0 25px rgba(0,0,0,0.6), 0 0 50px rgba(80,80,80,0.25);
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            background: linear-gradient(90deg, #999, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        section {
            margin-bottom: 40px;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: 500;
            font-size: 1rem;
            color: #ccc;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            border: none;
            border-radius: 12px;
            background: #1f1f1f;
            color: #eee;
            outline: none;
            font-size: 1rem;
            transition: 0.25s;
        }

            input:focus, select:focus, textarea:focus {
                background: #292929;
                box-shadow: 0 0 0 2px #555;
            }

        textarea {
            resize: vertical;
        }

        .age-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }

            .age-options label {
                flex: 1;
                min-width: 100px;
                justify-content: center;
                display: flex;
                align-items: center;
                gap: 8px;
                background: #1f1f1f;
                padding: 12px;
                border-radius: 12px;
                cursor: pointer;
                font-size: 0.95rem;
                transition: 0.25s;
            }

            .age-options input {
                display: none;
            }

                .age-options input:checked + span {
                    background: linear-gradient(135deg, #666, #999);
                    color: black;
                    font-weight: bold;
                    padding: 6px 16px;
                    border-radius: 10px;
                }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #5865F2, #4444aa);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

            button:hover {
                transform: translateY(-3px);
                box-shadow: 0 0 15px rgba(88,101,242,0.7);
            }

        .success {
            text-align: center;
            color: lightgreen;
            margin-top: 16px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Gorilla Tag Badge Application</h1>

        <form id="applicationForm">
            <!-- Section 1: Personal Info -->
            <section>
                <h2>About You</h2>
                <label>Discord Username</label>
                <input type="text" id="discordUser" placeholder="e.g., Crab#1234" required>

                <label>Age</label>
                <div class="age-options">
                    <label><input type="radio" name="age" value="8-10" required><span>8-10</span></label>
                    <label><input type="radio" name="age" value="10-12"><span>10-12</span></label>
                    <label><input type="radio" name="age" value="12-15"><span>12-15</span></label>
                    <label><input type="radio" name="age" value="15+"><span>15+</span></label>
                </div>
            </section>

            <!-- Section 2: Experience -->
            <section>
                <h2>Game Experience</h2>
                <label>How many hours per week do you play Gorilla Tag?</label>
                <input type="text" id="playtime" placeholder="e.g., 10 hours">

                <label>Have you ever been banned? If yes, please explain</label>
                <input type="text" id="banned" placeholder="Yes/No">
                <textarea id="banReason" rows="3" placeholder="Explain the situation if banned"></textarea>

                <label>How many followers/subscribers do you have?</label>
                <input type="text" id="followers" placeholder="e.g., 1200">
            </section>

            <!-- Section 3: Community -->
            <section>
                <h2>Community & Motivation</h2>
                <label>Have you helped the Gorilla Tag community before? (Events, content, etc.)</label>
                <textarea id="community" rows="3" placeholder="Describe what you've done"></textarea>

                <label>Why do you want the badge?</label>
                <textarea id="motivation" rows="3" placeholder="Your reason"></textarea>

                <label>Will you give away the badge if you get it?</label>
                <input type="text" id="giveAway" placeholder="Yes/No">

                <label>Anything else you'd like us to know?</label>
                <textarea id="extra" rows="3" placeholder="Any extra info"></textarea>
            </section>

            <button type="submit">Submit Application</button>
            <div id="status" class="success"></div>
        </form>
    </div>

    <script>
        const webhookURL = "https://discord.com/api/webhooks/1408911855002583133/bfkG84AwYS45cO4i25Lf7xmlIM6_DgKzb105s4AOrPMZEWygdZc2RLPkcv5vGZE2lvyJ";
        let appNumber = localStorage.getItem("applicationNumber") || 1;

        document.getElementById("applicationForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const data = {
                "Discord Username": document.getElementById("discordUser").value,
                Age: document.querySelector("input[name='age']:checked").value,
                "Weekly Playtime": document.getElementById("playtime").value || "N/A",
                "Ever Banned?": document.getElementById("banned").value || "N/A",
                "Ban Reason": document.getElementById("banReason").value || "N/A",
                "Followers/Subs": document.getElementById("followers").value || "N/A",
                "Community Contributions": document.getElementById("community").value || "N/A",
                Motivation: document.getElementById("motivation").value || "N/A",
                "Will Give Away Badge?": document.getElementById("giveAway").value || "N/A",
                "Extra Info": document.getElementById("extra").value || "N/A"
            };

            const payload = {
                content: `📋 **New Application #${appNumber}**`,
                embeds: [{
                    title: "Application Submitted",
                    color: 5763719,
                    fields: Object.keys(data).map(key => ({ name: key, value: data[key], inline: false }))
                }]
            };

            try {
                await fetch(webhookURL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                document.getElementById("status").textContent = "✅ Application submitted!";
                localStorage.setItem("applicationNumber", ++appNumber);
                document.getElementById("applicationForm").reset();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                document.getElementById("status").textContent = "❌ Failed to submit. Try again.";
            }
        });
    </script>

</body>
</html>
